<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Learning World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/audio.css">
    <link rel="stylesheet" href="assets/css/feedback.css">
</head>
<body>
    <div class="landing-page">
        <div class="background-container">
            <picture>
                <source media="(max-width: 768px)" srcset="assets/images/backgrounds/landing-bg-mobile.webp" type="image/webp">
                <source media="(max-width: 768px)" srcset="assets/images/backgrounds/landing-bg-mobile.png">
                <source srcset="assets/images/backgrounds/landing-bg.webp" type="image/webp">
                <img src="assets/images/backgrounds/landing-bg.png" alt="ReadyKiddo learning world" class="background-image">
            </picture>
        </div>

        <div class="landing-actions">
        <button class="cta-button" id="startButton">
            <span class="cta-icon" aria-hidden="true">▶</span>
            <span>Start your journey</span>
        </button>
        <button class="resume-world-button" id="resumeWorldButton" hidden>
            <span>Resume World</span>
        </button>
        <p class="landing-sound-hint" aria-hidden="true">
            <span class="sound-note">♪</span> Sound on for the best experience
        </p>
        </div>
    </div>

    <script src="assets/js/audio-manager.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/feedback-widget.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        RKAudio.injectMuteButton('body');
        // Theme starts after page is fully loaded — never blocks render
        window.addEventListener('load', () => RKAudio.startTheme());
        // Unlock iOS audio context on first tap
        document.addEventListener('pointerdown', RKAudio.unlock, { once: true });
      });
    </script>
</body>
</html>
