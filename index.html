<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ReadyKiddo | Your Magical Learning World</title>
    <meta name="description" content="ReadyKiddo is a premium, neuro-inclusive learning platform for children aged 4-7.">
    <meta name="theme-color" content="#7C6CFF">
    
    <!-- PWA Support -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Fonts: Inter & Outfit for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="src/styles/main.css">
    <link rel="stylesheet" href="src/styles/motion.css">
    <link rel="stylesheet" href="src/styles/themes.css">
</head>
<body class="loading">
    <!-- App Shell -->
    <div id="readykiddo-app">
        <!-- Persistent Facilitator Buddy -->
        <div id="buddy-container" class="buddy-idle">
            <div id="buddy-avatar"></div>
            <div id="buddy-speech" class="hidden">
                <p id="buddy-text"></p>
                <div class="speech-tail"></div>
            </div>
        </div>

        <!-- Main View Container (Controlled by Router) -->
        <main id="main-view">
            <!-- Dynamic content mounts here -->
        </main>

        <!-- Global Toast/Coming Soon Tooltip -->
        <div id="tooltip" class="tooltip hidden">
            <span id="tooltip-text">Coming Soon</span>
        </div>

        <!-- Loading Overlay -->
        <div id="loading-overlay">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Script Entry -->
    <script type="module" src="src/js/app.js"></script>
</body>
</html>
