<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReadyKiddo | Learning Worlds Together</title>
  <meta name="description" content="ReadyKiddo helps parents and children build early learning worlds together." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="rk-landing" aria-label="ReadyKiddo landing page">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>

    <header class="brand" aria-label="ReadyKiddo brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 96 96" role="img">
          <defs>
            <linearGradient id="brandBook" x1="0" x2="1" y1="0" y2="1">
              <stop offset="0%" stop-color="#023257" />
              <stop offset="100%" stop-color="#294B65" />
            </linearGradient>
            <linearGradient id="brandPencil" x1="0" x2="1">
              <stop offset="0%" stop-color="#FA8D1C" />
              <stop offset="100%" stop-color="#F2D0A2" />
            </linearGradient>
          </defs>
          <path d="M18 26c0-5 4-9 9-9h42c5 0 9 4 9 9v43c0 5-4 9-9 9H27c-5 0-9-4-9-9V26Z" fill="#FEF5E3" />
          <path d="M28 31c9-4 19-3 20 4v34c-8-6-16-7-24-3V37c0-3 1-5 4-6Z" fill="url(#brandBook)" />
          <path d="M68 31c-9-4-19-3-20 4v34c8-6 16-7 24-3V37c0-3-1-5-4-6Z" fill="#FA8D1C" />
          <path d="M48 35v34" stroke="#F2D0A2" stroke-width="3" stroke-linecap="round" />
          <path d="M63 22l11 11-25 25-12 4 4-12 22-28Z" fill="url(#brandPencil)" />
          <path d="M72 31l4 4" stroke="#023257" stroke-width="4" stroke-linecap="round" />
        </svg>
      </div>
      <div class="brand-copy">
        <span class="brand-ready">Ready</span><span class="brand-kiddo">Kiddo</span>
      </div>
    </header>

    <section class="hero-copy" aria-labelledby="hero-title">
      <p class="eyebrow">Parent and child learning, together</p>
      <h1 id="hero-title">Build a learning world together.</h1>
      <p class="subhead">A warm, shared adventure where early skills become part of a world your family creates.</p>
    </section>

    <section class="world-stage" aria-label="Illustrated ReadyKiddo learning world preview">
      <svg class="journey-art" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="art-title art-desc">
        <title id="art-title">A parent and child at the start of a learning path</title>
        <desc id="art-desc">A warm sunrise landscape with a curved path, soft hills, learning letters, shapes, and simple parent-child silhouettes walking toward the horizon.</desc>
        <defs>
          <radialGradient id="sunGlow" cx="50%" cy="27%" r="47%">
            <stop offset="0%" stop-color="#FFD99B" stop-opacity="0.95" />
            <stop offset="38%" stop-color="#FFB565" stop-opacity="0.45" />
            <stop offset="100%" stop-color="#FFB565" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="skyWash" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#FFF8EC" />
            <stop offset="54%" stop-color="#FDE8C9" />
            <stop offset="100%" stop-color="#EFB86F" />
          </linearGradient>
          <linearGradient id="pathFill" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#FFD49A" stop-opacity="0.85" />
            <stop offset="42%" stop-color="#FA9B34" />
            <stop offset="100%" stop-color="#D96B00" />
          </linearGradient>
          <linearGradient id="pathLight" x1="0" x2="0" y1="0" y2="1">
            <stop offset="0%" stop-color="#FFF0C9" stop-opacity="0.9" />
            <stop offset="100%" stop-color="#F9B04B" stop-opacity="0.1" />
          </linearGradient>
          <linearGradient id="hillFar" x1="0" x2="1">
            <stop offset="0%" stop-color="#F6D7A5" />
            <stop offset="100%" stop-color="#F0C47D" />
          </linearGradient>
          <linearGradient id="hillNear" x1="0" x2="1">
            <stop offset="0%" stop-color="#EFAE5D" />
            <stop offset="100%" stop-color="#F7C67F" />
          </linearGradient>
          <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="10" />
          </filter>
          <filter id="figureShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#8B4A17" flood-opacity="0.25" />
          </filter>
          <filter id="floatShadow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#9B5A20" flood-opacity="0.18" />
          </filter>
        </defs>

        <rect width="1440" height="900" fill="url(#skyWash)" />
        <ellipse cx="720" cy="270" rx="520" ry="285" fill="url(#sunGlow)" />
        <ellipse cx="720" cy="385" rx="260" ry="55" fill="#FFE3AA" opacity="0.38" filter="url(#softBlur)" />

        <g class="clouds" opacity="0.72">
          <path d="M96 196c39-35 88-26 105 8 28-18 69-10 84 19 45-5 79 16 88 51H52c5-38 23-63 44-78Z" fill="#FFF5E7" opacity="0.74" />
          <path d="M1094 160c31-25 72-19 88 8 22-13 55-8 70 14 37-2 63 15 70 41h-272c5-28 20-50 44-63Z" fill="#FFF9EF" opacity="0.7" />
        </g>

        <g class="sparkles" aria-hidden="true">
          <circle cx="235" cy="310" r="5" fill="#FA8D1C" opacity="0.45" />
          <circle cx="382" cy="250" r="3" fill="#023257" opacity="0.28" />
          <circle cx="1040" cy="295" r="4" fill="#FA8D1C" opacity="0.45" />
          <circle cx="1175" cy="375" r="3" fill="#023257" opacity="0.24" />
          <path d="M925 235l8 18 19 8-19 8-8 18-8-18-19-8 19-8 8-18Z" fill="#F6B65C" opacity="0.5" />
        </g>

        <path d="M0 505c144-58 262-56 414-12 122 35 209 29 320-18 176-74 375-46 706 33v392H0V505Z" fill="url(#hillFar)" opacity="0.74" />
        <path d="M0 590c172-74 331-82 498-32 130 39 257 36 396-14 171-62 339-50 546 42v314H0V590Z" fill="url(#hillNear)" />
        <path d="M0 675c150-52 294-52 432-9 148 46 305 42 472-8 187-57 358-35 536 52v190H0V675Z" fill="#E99F4C" opacity="0.55" />

        <path class="main-path" d="M672 444 C710 506 728 579 687 646 C647 711 548 755 465 900 L975 900 C873 756 784 715 756 649 C728 582 758 506 768 444 C736 432 704 432 672 444Z" fill="url(#pathFill)" />
        <path class="path-center" d="M706 458 C724 526 721 586 704 637 C688 690 632 751 575 900 L858 900 C810 750 759 694 742 638 C725 580 727 523 734 458 C726 454 715 454 706 458Z" fill="url(#pathLight)" opacity="0.48" />
        <path d="M672 444 C710 506 728 579 687 646 C647 711 548 755 465 900" fill="none" stroke="#B85F10" stroke-opacity="0.26" stroke-width="6" />
        <path d="M768 444 C736 512 730 581 756 649 C784 715 873 756 975 900" fill="none" stroke="#FFF0C9" stroke-opacity="0.36" stroke-width="5" />

        <g class="learning-piece piece-a" filter="url(#floatShadow)">
          <circle cx="370" cy="575" r="56" fill="#FEF5E3" opacity="0.96" />
          <text x="370" y="596" text-anchor="middle" font-family="Outfit, sans-serif" font-size="70" font-weight="800" fill="#023257">A</text>
        </g>

        <g class="learning-piece piece-book" filter="url(#floatShadow)">
          <path d="M1012 552c45-22 88-18 126 10v82c-41-22-82-25-126-3v-89Z" fill="#023257" opacity="0.94" />
          <path d="M1012 552c-45-22-88-18-126 10v82c41-22 82-25 126-3v-89Z" fill="#FA8D1C" opacity="0.94" />
          <path d="M1012 552v91" stroke="#F2D0A2" stroke-width="5" stroke-linecap="round" />
        </g>

        <g class="learning-piece piece-shapes" filter="url(#floatShadow)">
          <rect x="194" y="695" width="72" height="72" rx="18" fill="#FA8D1C" />
          <circle cx="1168" cy="707" r="42" fill="#294B65" opacity="0.92" />
          <path d="M1228 794l45-82 45 82H1228Z" fill="#023257" opacity="0.94" />
        </g>

        <g class="figures-svg" filter="url(#figureShadow)">
          <ellipse cx="710" cy="842" rx="104" ry="28" fill="#6F3A12" opacity="0.18" />
          <g class="adult-figure">
            <circle cx="674" cy="684" r="26" fill="#023257" />
            <path d="M652 716 C646 759 648 802 660 840 L704 840 C713 800 712 756 700 716 C687 707 667 707 652 716Z" fill="#023257" />
            <path d="M699 743 C725 755 742 771 756 794" fill="none" stroke="#023257" stroke-width="14" stroke-linecap="round" />
            <path d="M659 838 C648 861 639 880 628 900" fill="none" stroke="#023257" stroke-width="15" stroke-linecap="round" />
            <path d="M696 838 C710 860 721 881 733 900" fill="none" stroke="#023257" stroke-width="15" stroke-linecap="round" />
          </g>
          <g class="child-figure">
            <circle cx="764" cy="735" r="18" fill="#023257" />
            <path d="M748 759 C744 789 747 818 755 845 L782 845 C790 816 789 789 779 759 C770 752 757 752 748 759Z" fill="#023257" />
            <path d="M750 780 C732 789 717 797 701 811" fill="none" stroke="#023257" stroke-width="10" stroke-linecap="round" />
            <path d="M757 844 C751 865 746 883 740 900" fill="none" stroke="#023257" stroke-width="11" stroke-linecap="round" />
            <path d="M779 844 C789 865 795 883 801 900" fill="none" stroke="#023257" stroke-width="11" stroke-linecap="round" />
          </g>
          <path d="M754 792 C738 797 724 803 704 813" fill="none" stroke="#023257" stroke-width="9" stroke-linecap="round" opacity="0.98" />
        </g>
      </svg>
    </section>
  </main>
</body>
</html>
