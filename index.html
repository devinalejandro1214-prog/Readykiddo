<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReadyKiddo</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div class="scene">

    <header class="header">
      <img src="assets/logo.png" alt="ReadyKiddo Logo" class="logo" />
    </header>

    <section class="hero-text">
      <h1>Build a learning world together.</h1>
      <p>A parent-child experience that turns early learning into a shared adventure.</p>
    </section>

    <div class="horizon"></div>

    <div class="path"></div>

    <div class="figures">
      <div class="parent"></div>
      <div class="child"></div>
    </div>

    <div class="elements">
      <div class="shape cube"></div>
      <div class="shape triangle"></div>
      <div class="shape circle"></div>
    </div>

  </div>
</body>
</html>
