<!doctype html>
<html lang="en" data-route="landing" data-sensory="gentle" data-nav="buttons" data-palette="pastel" data-vibe="cozy" data-music="lo-fi" data-interest="dino">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ReadyKiddo | Motion-First Learning Worlds</title>
  <meta name="description" content="ReadyKiddo is a premium, neuro-inclusive motion-first learning and streaming platform for children ages 4-7." />
  <meta name="theme-color" content="#7C6CFF" />
  <link rel="stylesheet" href="./src/styles/main.css" />
</head>
<body>
  <a class="skip-link" href="#app">Skip to ReadyKiddo</a>

  <div class="world-backdrop" aria-hidden="true">
    <svg class="depth-svg depth-back" viewBox="0 0 1440 900" preserveAspectRatio="none">
      <defs>
        <radialGradient id="rk-orb-a" cx="40%" cy="30%" r="60%">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity=".35" />
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="rk-orb-b" cx="70%" cy="55%" r="52%">
          <stop offset="0%" stop-color="var(--accent-2)" stop-opacity=".35" />
          <stop offset="100%" stop-color="var(--accent-2)" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="rk-ribbon" x1="0" x2="1">
          <stop offset="0%" stop-color="var(--accent)" />
          <stop offset="100%" stop-color="var(--accent-2)" />
        </linearGradient>
      </defs>
      <rect width="1440" height="900" fill="url(#rk-orb-a)" />
      <rect width="1440" height="900" fill="url(#rk-orb-b)" />
      <path class="ribbon ribbon-one" d="M-80,650 C160,520 310,780 530,628 C755,472 880,420 1110,530 C1280,610 1390,536 1530,450" fill="none" stroke="url(#rk-ribbon)" stroke-width="34" stroke-linecap="round" opacity=".14" />
      <path class="ribbon ribbon-two" d="M-90,215 C120,340 305,120 530,246 C760,376 920,184 1138,260 C1294,315 1412,290 1530,196" fill="none" stroke="url(#rk-ribbon)" stroke-width="22" stroke-linecap="round" opacity=".11" />
    </svg>

    <div class="depth-glass depth-layer-one"></div>
    <div class="depth-glass depth-layer-two"></div>
    <div class="depth-dots">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
  </div>

  <header class="app-header" aria-label="ReadyKiddo app header">
    <a class="brand-lockup" href="#/" aria-label="ReadyKiddo home">
      <svg class="brand-mark" viewBox="0 0 72 72" role="img" aria-labelledby="rk-logo-title">
        <title id="rk-logo-title">ReadyKiddo logo</title>
        <rect x="8" y="8" width="56" height="56" rx="20" fill="url(#rk-logo-fill)" />
        <defs>
          <linearGradient id="rk-logo-fill" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0%" stop-color="var(--accent)" />
            <stop offset="100%" stop-color="var(--accent-2)" />
          </linearGradient>
        </defs>
        <path d="M22 43c0-11 7.8-20 18-20 4.8 0 8.5 1.6 11.2 4.5-7 0-11.2 4.4-11.2 11.2V43H22z" fill="white" opacity=".96" />
        <circle cx="31.5" cy="34" r="3.2" fill="var(--ink)" opacity=".72" />
        <path d="M19.5 24.2c3.7-6.2 10.4-8.5 16.2-5.1-5.8.8-9.8 4.4-12.3 10.5l-3.9-5.4z" fill="white" opacity=".68" />
      </svg>
      <span>
        <strong>ReadyKiddo</strong>
        <em>motion-first learning worlds</em>
      </span>
    </a>

    <nav class="header-tools" aria-label="Experience controls">
      <button class="tool-pill" type="button" data-action="toggle-audio" aria-pressed="false">
        <span class="tool-icon" aria-hidden="true">♪</span>
        <span data-audio-label>Sound cues</span>
      </button>
      <button class="tool-pill" type="button" data-action="safe-mode">
        <span class="tool-icon" aria-hidden="true">◌</span>
        Calm mode
      </button>
      <a class="tool-pill tool-link" href="#/comfort">Comfort setup</a>
    </nav>
  </header>

  <div class="motion-bridge" id="motion-bridge" aria-hidden="true" hidden><span></span><span></span><span></span><span></span></div>

  <main id="app" class="app-shell" tabindex="-1"></main>

  <div class="dock" id="world-dock" aria-label="World sectors" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
