  <title>ReadyKiddo — Your Learning World</title>
  <meta name="description" content="A uniquely adaptive, parametric learning platform for kids. Your world, your way.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-theme="space" data-vibe="balanced">

  <!-- Procedural environment — managed entirely by Environment.js -->

  <!-- App shell — all views injected here by Core.js -->
  <div id="app"></div>

  <!-- ES6 module entry point -->
  <script type="module" src="js/main.js"></script>

</html>
