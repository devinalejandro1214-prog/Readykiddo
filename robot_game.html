<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robot & Friends - ReadyKiddo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/robot_game.css">
</head>
<body>
  <!-- Header / Navigation -->
  <header class="game-header">
    <a href="index.html" class="back-btn">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      Back to KidsStream
    </a>
    <h1 class="game-title">ROBOT & FRIENDS</h1>
    <div class="level-indicator">Level <span id="level-num">1</span></div>
  </header>

  <main class="game-container">
    <!-- Grid Area -->
    <section class="grid-section">
      <div id="game-grid" class="game-grid">
        <!-- Cells generated by JS -->
      </div>
      <div id="game-message" class="game-message hidden">
        <h2>Awesome Job!</h2>
        <button id="next-level-btn" class="action-btn">Next Level 🚀</button>
      </div>
    </section>

    <!-- Controls Area -->
    <section class="controls-section">
      <div class="instructions">
        <h3>Help the Robot reach its friend!</h3>
        <p>Give the robot instructions by adding arrows to the sequence.</p>
      </div>

      <!-- Sequence Built by User -->
      <div class="sequence-area">
        <h4>Sequence:</h4>
        <div id="sequence-container" class="sequence-container">
          <!-- Commands go here -->
          <span class="empty-sequence">Add commands below...</span>
        </div>
      </div>

      <!-- Command Buttons -->
      <div class="command-palette">
        <button class="command-btn" data-dir="up"><img src="assets/game_arrow.png" class="arrow-img arrow-up" alt="Up"></button>
        <button class="command-btn" data-dir="left"><img src="assets/game_arrow.png" class="arrow-img arrow-left" alt="Left"></button>
        <button class="command-btn" data-dir="right"><img src="assets/game_arrow.png" class="arrow-img arrow-right" alt="Right"></button>
        <button class="command-btn" data-dir="down"><img src="assets/game_arrow.png" class="arrow-img arrow-down" alt="Down"></button>
      </div>

      <!-- Actions -->
      <div class="action-buttons">
        <button id="run-btn" class="action-btn run-btn">RUN! ▶️</button>
        <button id="clear-btn" class="action-btn clear-btn">Clear ↺</button>
      </div>
    </section>
  </main>

  <script src="js/robot_game.js"></script>
</body>
</html>
