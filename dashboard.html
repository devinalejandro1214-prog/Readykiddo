<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReadyKiddo — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/zoey-avatar.js"></script>
  <script src="assets/js/zoey-client.js"></script>
  <style>
    :root {
      --ready-blue:    #09395f;
      --ready-blue-2:  #0b5f95;
      --ready-orange:  #f28c18;
      --ready-orange-2:#ffb23e;
      --paper:         #fff7e8;
      --ink:           #102338;
      --muted:         #45596b;
      --green:         #22c55e;
    }

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family:'Fredoka','Segoe UI',sans-serif;
      background:
        radial-gradient(120% 80% at 50% -10%, rgba(255,178,62,0.22), transparent 60%),
        radial-gradient(80% 60% at 100% 110%, rgba(11,95,149,0.18), transparent 60%),
        linear-gradient(180deg, #f6e9c8 0%, #f1d9a2 100%);
      min-height:100vh;
      overflow-y:auto;
    }

    /* ── Header ── */
    .header {
      display:flex; align-items:center; gap:12px;
      padding:18px 24px;
      max-width:680px;
      margin:0 auto;
    }
    .brand {
      display:flex; align-items:center; gap:10px;
      color:var(--ready-blue); font-weight:700;
      margin-right:auto; text-decoration:none;
    }
    .brand-mark {
      width:34px; height:34px;
      border-radius:10px;
      background:linear-gradient(135deg, var(--ready-orange), var(--ready-orange-2));
      display:grid; place-items:center;
      box-shadow:0 6px 14px rgba(242,140,24,0.42);
      transform:rotate(-6deg);
      flex-shrink:0;
    }
    .brand-name {
      font-size:18px; font-weight:700;
      color:var(--ready-blue);
    }
    .header-email {
      font-size:12px; color:var(--muted); font-weight:500;
      max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .sign-out-btn {
      background:rgba(9,57,95,0.07);
      color:var(--ready-blue);
      border:2px solid rgba(9,57,95,0.12);
      border-radius:20px; padding:6px 16px;
      font-family:'Fredoka',sans-serif; font-size:13px; font-weight:600;
      cursor:pointer;
      transition:background .2s, border-color .2s;
    }
    .sign-out-btn:hover {
      background:rgba(9,57,95,0.13);
      border-color:rgba(9,57,95,0.22);
    }

    /* ── Content ── */
    .content {
      max-width:680px; margin:0 auto;
      padding:0 20px 40px;
      display:flex; flex-direction:column; gap:20px;
    }

    /* ── Card base ── */
    .card {
      background:#fff;
      border-radius:24px;
      border:2px solid rgba(9,57,95,0.08);
      box-shadow:0 12px 32px rgba(9,57,95,0.12);
      padding:20px 24px;
    }

    /* ── Child hero card ── */
    .hero-card {
      position:relative;
      overflow:hidden;
    }
    .hero-greeting {
      font-size:28px; font-weight:700;
      color:var(--ready-blue);
      margin-bottom:4px;
    }
    .hero-world {
      font-family:'Caveat',cursive;
      font-size:32px; font-weight:700;
      color:var(--ready-orange);
      line-height:1.1;
      margin-bottom:16px;
    }
    .child-chip {
      display:inline-flex; align-items:center; gap:10px;
      background:rgba(9,57,95,0.06);
      border-radius:50px; padding:8px 16px;
    }
    .child-chip .av  { font-size:22px; }
    .child-chip .cn  { font-size:15px; font-weight:700; color:var(--ink); }
    .child-chip .ca  { font-size:12px; color:var(--muted); margin-top:1px; }
    .hero-stamp {
      position:absolute; top:18px; right:20px;
      font-family:'Caveat',cursive;
      font-size:13px; font-weight:700;
      color:var(--ready-blue);
      background:rgba(9,57,95,0.06);
      border:2px dashed rgba(9,57,95,0.18);
      border-radius:10px;
      padding:6px 10px;
      transform:rotate(3deg);
      line-height:1.4;
      text-align:center;
      opacity:0.85;
    }

    /* ── Section label ── */
    .section-label {
      font-size:11px; font-weight:700;
      text-transform:uppercase; letter-spacing:0.12em;
      color:var(--muted);
      margin-bottom:14px;
    }

    /* ── Play button ── */
    .play-btn {
      display:flex; align-items:center; justify-content:center; gap:10px;
      background:linear-gradient(135deg, var(--ready-orange), var(--ready-orange-2));
      color:#fff; border:none; border-radius:22px;
      padding:16px 34px; width:100%;
      min-width:280px;
      font-family:'Fredoka',sans-serif; font-size:20px; font-weight:700;
      cursor:pointer;
      box-shadow:0 14px 30px rgba(242,140,24,0.38);
      transition:transform .2s, box-shadow .2s;
      text-decoration:none;
    }
    .play-btn:hover {
      transform:translateY(-2px);
      box-shadow:0 18px 36px rgba(242,140,24,0.48);
    }

    /* ── Progress section ── */
    .progress-header {
      display:flex; align-items:center; justify-content:space-between;
      margin-bottom:14px;
    }
    .progress-count {
      font-size:12px; font-weight:700;
      color:var(--ready-orange);
      background:rgba(242,140,24,0.10);
      border-radius:20px; padding:3px 10px;
    }
    .prog-list {
      display:flex; flex-direction:column; gap:8px;
    }
    .prog-row {
      display:flex; align-items:center; gap:12px;
      background:rgba(9,57,95,0.035);
      border-radius:16px;
      padding:10px 14px;
      transition:background .15s;
    }
    .prog-row:hover { background:rgba(9,57,95,0.06); }
    .prog-icon { font-size:22px; flex-shrink:0; }
    .prog-name {
      flex:1;
      font-size:14px; font-weight:600;
      color:var(--ink);
    }
    .prog-badge {
      font-size:11px; font-weight:700;
      padding:3px 10px; border-radius:20px;
      flex-shrink:0;
    }
    .prog-badge.done {
      background:#dcfce7; color:#16a34a;
    }
    .prog-badge.none {
      background:rgba(9,57,95,0.06); color:var(--muted);
    }

    /* ── Zoey chat ── */
    .zoey-header {
      display:flex; align-items:center; gap:12px;
      margin-bottom:16px;
    }
    .zoey-icon {
      width:48px; height:48px; border-radius:50%;
      background:transparent;
      display:flex; align-items:center; justify-content:center;
      font-size:22px; flex-shrink:0;
      box-shadow:0 6px 18px rgba(242,140,24,0.38);
    }
    .zoey-name {
      font-family:'Caveat',cursive;
      font-size:26px; font-weight:700;
      color:var(--ready-blue); line-height:1;
    }
    .zoey-tagline {
      font-size:12px; color:var(--muted); font-weight:500;
      margin-top:1px;
    }

    /* Chat messages */
    .chat-msgs {
      display:flex; flex-direction:column; gap:10px;
      margin-bottom:14px;
      max-height:320px; overflow-y:auto;
      padding-right:4px;
    }
    .chat-msgs:empty { display:none; }

    .msg-bubble {
      max-width:86%;
      padding:10px 14px;
      border-radius:18px;
      font-size:14px; line-height:1.55;
      animation:bubbleIn .25s ease both;
    }
    @keyframes bubbleIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

    .msg-bubble.user {
      background:linear-gradient(135deg, var(--ready-blue), var(--ready-blue-2));
      color:#fff;
      align-self:flex-end;
      border-bottom-right-radius:5px;
    }
    .msg-bubble.zoey {
      background:rgba(9,57,95,0.06);
      color:var(--ink);
      align-self:flex-start;
      border-bottom-left-radius:5px;
      border:1.5px solid rgba(9,57,95,0.08);
    }
    .msg-bubble.error {
      background:#fef2f2;
      color:#b91c1c;
      align-self:flex-start;
      border:1.5px solid #fecaca;
      border-bottom-left-radius:5px;
      font-size:13px;
    }

    /* Typing indicator */
    .typing-bubble {
      display:flex; gap:5px; align-items:center;
      padding:12px 16px;
      background:rgba(9,57,95,0.06);
      border-radius:18px; border-bottom-left-radius:5px;
      border:1.5px solid rgba(9,57,95,0.08);
      align-self:flex-start;
      width:64px;
    }
    .typing-dot {
      width:7px; height:7px; border-radius:50%;
      background:var(--muted);
      animation:tdot 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2){animation-delay:.2s}
    .typing-dot:nth-child(3){animation-delay:.4s}
    @keyframes tdot{0%,100%{transform:translateY(0);opacity:.4}50%{transform:translateY(-5px);opacity:1;background:var(--ready-orange)}}

    /* Input row */
    .chat-input-row {
      display:flex; gap:10px; align-items:flex-end;
    }
    .chat-input {
      flex:1;
      padding:11px 14px;
      border:2.5px solid rgba(9,57,95,0.10);
      border-radius:14px;
      font-family:'Fredoka',sans-serif;
      font-size:15px; font-weight:500;
      color:var(--ink);
      background:#fff;
      resize:none;
      min-height:46px; max-height:120px;
      outline:none;
      transition:border-color .2s, box-shadow .2s;
      line-height:1.4;
    }
    .chat-input:focus {
      border-color:var(--ready-orange);
      box-shadow:0 0 0 3px rgba(242,140,24,0.15);
    }
    .chat-input::placeholder { color:rgba(9,57,95,0.32); font-weight:500; }
    .chat-send {
      width:46px; height:46px; flex-shrink:0;
      background:linear-gradient(135deg, var(--ready-orange), var(--ready-orange-2));
      color:#fff; border:none; border-radius:14px;
      font-size:18px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 4px 12px rgba(242,140,24,0.35);
      transition:transform .15s, box-shadow .15s;
    }
    .chat-send:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 6px 16px rgba(242,140,24,0.45); }
    .chat-send:disabled { opacity:.45; cursor:not-allowed; }

    /* Starter prompts */
    .starters {
      display:flex; flex-wrap:wrap; gap:7px;
      margin-bottom:14px;
    }
    .starter-btn {
      background:rgba(9,57,95,0.05);
      border:1.5px solid rgba(9,57,95,0.12);
      border-radius:20px; padding:6px 13px;
      font-family:'Fredoka',sans-serif;
      font-size:12px; font-weight:600;
      color:var(--ready-blue); cursor:pointer;
      transition:background .2s, border-color .2s;
      line-height:1.3;
    }
    .starter-btn:hover {
      background:rgba(242,140,24,0.08);
      border-color:var(--ready-orange);
      color:var(--ready-orange);
    }

    /* ── Spinner ── */
    .spinner {
      width:28px; height:28px; border-radius:50%;
      border:3px solid rgba(9,57,95,0.12);
      border-top-color:var(--ready-orange);
      animation:spin .7s linear infinite;
      margin:20px auto;
    }
    @keyframes spin { to{ transform:rotate(360deg) } }

    /* ── Loading overlay ── */
    .loading-overlay {
      position:fixed; inset:0;
      background:
        radial-gradient(120% 80% at 50% -10%, rgba(255,178,62,0.22), transparent 60%),
        radial-gradient(80% 60% at 100% 110%, rgba(11,95,149,0.18), transparent 60%),
        linear-gradient(180deg, #f6e9c8 0%, #f1d9a2 100%);
      display:flex; align-items:center; justify-content:center;
      z-index:100;
    }
    .lo-inner { text-align:center; }
    .lo-brand {
      display:flex; align-items:center; justify-content:center; gap:10px;
      margin-bottom:20px;
    }
    .lo-mark {
      width:40px; height:40px;
      border-radius:12px;
      background:linear-gradient(135deg, var(--ready-orange), var(--ready-orange-2));
      display:grid; place-items:center;
      box-shadow:0 6px 14px rgba(242,140,24,0.42);
      transform:rotate(-6deg);
    }
    .lo-name {
      font-size:24px; font-weight:700;
      color:var(--ready-blue);
    }

    /* ── Responsive ── */
    @media(max-width:480px) {
      .header { padding:14px 16px; }
      .content { padding:0 16px 32px; }
      .card { padding:16px 18px; }
      .hero-stamp { display:none; }
      .header-email { display:none; }
    }
  </style>
</head>
<body x-data="dashApp()" x-init="init()">

  <!-- Loading overlay while checking auth -->
  <div class="loading-overlay" x-show="authChecking">
    <div class="lo-inner">
      <div class="lo-brand">
        <div class="lo-mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M12 2l2.6 5.4L20 8l-4 4 1 6-5-2.7L7 18l1-6-4-4 5.4-.6L12 2z"
                  stroke="white" fill="none" stroke-width="2.6"
                  stroke-linejoin="round" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="lo-name">ReadyKiddo</div>
      </div>
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Main app (hidden until auth confirmed) -->
  <template x-if="!authChecking">
    <div>

      <!-- ── Header ── -->
      <header class="header">
        <a class="brand" href="#">
          <div class="brand-mark">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M12 2l2.6 5.4L20 8l-4 4 1 6-5-2.7L7 18l1-6-4-4 5.4-.6L12 2z"
                    stroke="white" fill="none" stroke-width="2.6"
                    stroke-linejoin="round" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="brand-name">ReadyKiddo</span>
        </a>
        <span class="header-email" x-text="userEmail"></span>
        <button class="sign-out-btn" @click="signOut()">Sign Out</button>
      </header>

      <div class="content">

        <!-- ── Child Hero Card ── -->
        <div class="card hero-card">
          <div class="hero-greeting" x-text="greeting"></div>
          <div class="hero-world" x-text="child.name + '’s World'"></div>
          <div class="child-chip">
            <span class="av" x-text="child.avatar === 'Amara' ? '👧' : '🧒'"></span>
            <div>
              <div class="cn" x-text="child.name"></div>
              <div class="ca" x-text="'Age ' + child.age_range + ' · ' + (child.avatar || 'Em')"></div>
            </div>
          </div>
          <div class="hero-stamp" x-text="'Age ' + child.age_range + '\n' + (child.avatar || 'Em')"></div>
        </div>

        <!-- ── Hand to Child ── -->
        <div class="card">
          <div class="section-label">Ready to Play?</div>
          <a href="child-home.html" class="play-btn">
            Hand to Child 🧒
          </a>
          <p style="text-align:center;margin-top:10px;font-size:13px;color:var(--muted);">
            Opens the child's play screen — they can't access the parent dashboard from there.
          </p>
        </div>

        <!-- ── Progress ── -->
        <div class="card">
          <div class="progress-header">
            <div class="section-label" style="margin-bottom:0;">Progress</div>
            <div class="progress-count" x-text="completedCount + ' / ' + totalGames + ' games'"></div>
          </div>
          <template x-if="sessionsLoading">
            <div class="spinner"></div>
          </template>
          <template x-if="!sessionsLoading">
            <div class="prog-list">
              <template x-for="game in gameList" :key="game.id">
                <div class="prog-row">
                  <span class="prog-icon" x-text="game.icon"></span>
                  <span class="prog-name" x-text="game.name"></span>
                  <span class="prog-badge" :class="completedIds.has(game.id) ? 'done' : 'none'"
                        x-text="completedIds.has(game.id) ? '✓ Done' : 'Not yet'"></span>
                </div>
              </template>
            </div>
          </template>
        </div>

        <!-- ── Zoey Chat ── -->
        <div class="card" x-data="zoeyChat()">

          <!-- Header -->
          <div class="zoey-header">
            <div class="zoey-icon">
              <zoey-avatar id="zoeyDash" size="48"></zoey-avatar>
            </div>
            <div>
              <div class="zoey-name">Zoey</div>
              <div class="zoey-tagline">AI Learning Advisor · powered by Gemini 2.5</div>
            </div>
          </div>

          <!-- Starter prompts (shown until first message) -->
          <div class="starters" x-show="messages.length === 0">
            <template x-for="s in starters" :key="s">
              <button class="starter-btn" @click="sendMessage(s)" x-text="s"></button>
            </template>
          </div>

          <!-- Message history -->
          <div class="chat-msgs" id="chatMsgs" x-ref="msgs">
            <template x-for="(m, i) in messages" :key="i">
              <div class="msg-bubble" :class="m.role" x-text="m.text"></div>
            </template>
            <!-- Typing indicator -->
            <div class="typing-bubble" x-show="thinking">
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
              <div class="typing-dot"></div>
            </div>
          </div>

          <!-- Input -->
          <div class="chat-input-row">
            <textarea
              class="chat-input"
              x-model="draft"
              placeholder="Ask Zoey anything about your child’s learning…"
              rows="1"
              @keydown.enter.prevent="if(!$event.shiftKey) sendMessage()"
              @input="autoResize($el)"
              :disabled="thinking"
            ></textarea>
            <button class="chat-send" @click="sendMessage()" :disabled="thinking || !draft.trim()" title="Send">
              ➤
            </button>
          </div>

        </div>

      </div><!-- /content -->
    </div>
  </template>

<script>
  // All game IDs registered in the app
  const GAME_LIST = [
    { id:'shape-recognition', name:'Shapes',         icon:'🔷' },
    { id:'color-sort',        name:'Color Sort',     icon:'🎨' },
    { id:'number-matching',   name:'Numbers',        icon:'🔢' },
    { id:'abc-match',         name:'ABC Match',      icon:'🔤' },
    { id:'space-pattern',     name:'Patterns',       icon:'🌌' },
    { id:'space-defender',    name:'Space Defender', icon:'🚀' },
    { id:'feed-alien',        name:'Feed Alien',     icon:'👾' },
    { id:'number-line',       name:'Number Line',    icon:'📏' },
    { id:'feed-by-sound',     name:'Feed by Sound',  icon:'🎵' },
    { id:'draw-it',           name:'Draw It',        icon:'✏️' },
    { id:'candyland',         name:'Candy Land',     icon:'🍭' },
  ];

  function dashApp() {
    return {
      authChecking:  true,
      sessionsLoading: true,
      child:         { name: '', age_range: '', avatar: 'Em' },
      userEmail:     '',
      completedIds:  new Set(),
      gameList:      GAME_LIST,
      totalGames:    GAME_LIST.length,

      get completedCount() {
        return [...this.completedIds].filter(id =>
          GAME_LIST.some(g => g.id === id)
        ).length;
      },

      get greeting() {
        const h = new Date().getHours();
        if (h < 12) return 'Good morning ☀️';
        if (h < 17) return 'Good afternoon 👋';
        return 'Good evening 🌙';
      },

      async init() {
        // Auth guard
        const user = await window.RK.requireAuth('auth.html');
        if (!user) return;

        this.userEmail = user.email;

        // Load active child
        const child = window.RK.getActiveChild();
        if (!child) {
          // Try to fetch from DB
          const { data: children } = await window.RK.getChildren(user.id);
          if (children && children.length > 0) {
            window.RK.setActiveChild(children[0]);
            this.child = children[0];
          } else {
            window.location.href = 'auth.html';
            return;
          }
        } else {
          this.child = child;
        }

        this.authChecking = false;

        // Load progress
        const completed = await window.RK.getCompletedGameIds();
        this.completedIds = completed;
        window._rkCompletedIds = completed; // expose for zoeyChat
        this.sessionsLoading = false;

        // Zoey waves hello once the dashboard is ready
        setTimeout(() => document.getElementById('zoeyDash')?.wave(), 600);
      },

      async signOut() {
        await window.RK.signOut('auth.html');
      },
    };
  }

  // ── Zoey Chat Component ──────────────────────────────────────
  function zoeyChat() {
    return {
      messages:  [],   // { role: 'user'|'zoey'|'error', text: string }[]
      draft:     '',
      thinking:  false,
      starters: [
        'How is my child doing with numbers?',
        'What can we practice at home?',
        'Is their progress normal for their age?',
        'What game should they try next?',
      ],

      async sendMessage(text) {
        const msg = (text ?? this.draft).trim();
        if (!msg || this.thinking) return;
        this.draft = '';
        this.messages.push({ role: 'user', text: msg });
        this.thinking = true;
        this.$nextTick(() => this.scrollToBottom());

        const zoeyEl = document.getElementById('zoeyDash');
        zoeyEl?.think(); // 🤔 thinking…

        try {
          const completedIds = window._rkCompletedIds ?? new Set();
          const reply = await window.Zoey.ask(msg, completedIds);
          this.messages.push({ role: 'zoey', text: reply });
          zoeyEl?.talk(Math.min(2000 + reply.length * 30, 6000)); // 🗣️ talk while reply reads
        } catch (err) {
          this.messages.push({
            role: 'error',
            text: err.message ?? 'Zoey could not respond. Try again.',
          });
          zoeyEl?.idle(); // 😶 fall back to idle on error
        } finally {
          this.thinking = false;
          this.$nextTick(() => this.scrollToBottom());
        }
      },

      scrollToBottom() {
        const el = document.getElementById('chatMsgs');
        if (el) el.scrollTop = el.scrollHeight;
      },

      autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 120) + 'px';
      },
    };
