name: Approved Feedback Agent

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: feedback-agent-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement-approved-feedback:
    if: github.event.label.name == 'approved-for-agent'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug workflow configuration
        run: |
          echo "github.sha=${{ github.sha }}"
          echo "github.workflow_ref=${{ github.workflow_ref }}"
          echo "github.workflow_sha=${{ github.workflow_sha }}"
          echo "configured claude_args=--max-turns 30"
          grep -n "claude_args\|max-turns" .github/workflows/approved-feedback-agent.yml

      - name: Run Claude Code on approved feedback
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          label_trigger: approved-for-agent
          branch_prefix: agent/
          branch_name_template: "{{prefix}}feedback-{{entityNumber}}-{{timestamp}}"
          track_progress: "true"
          prompt: |
            Implement the smallest safe fix for the approved feedback in this GitHub issue.

            Scope rules:
            - Treat the issue text as the only approved work.
            - Make the smallest focused change that resolves the specific request.
            - Do not refactor unrelated code.
            - Do not redesign pages, rename files, or change workflows unless the issue explicitly asks for it.
            - If the request is ambiguous, risky, or too broad for a small safe fix, stop and comment on the issue explaining what clarification is needed.
            - If the fix needs secrets, production access, third-party account setup, or manual product decisions, stop and comment instead of guessing.

            Guardrails:
            - Create code changes on an agent branch and open a pull request.
            - Do not merge the pull request.
            - Do not deploy production.
            - Keep changes scoped to the approved issue.
            - Preserve existing user-facing flows unless the issue explicitly asks to change them.
            - Run `npm test`, `npm run build`, and `git diff --check` before finishing.
            - Include the test results in the PR body.
            - In the PR body, mention that Codex should review the PR before merge.
          claude_args: "--max-turns 30"
