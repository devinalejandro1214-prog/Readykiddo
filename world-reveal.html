<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadyKiddo - Your World</title>
    <link rel="stylesheet" href="assets/css/world-reveal.css">
</head>
<body>
    <div class="world-reveal-page">

        <!-- Full-page background (world + vibe) -->
        <div class="background-container">
            <img id="backgroundImage" class="background-image" src="" alt="Your world background">
        </div>

        <!-- Two-panel layout -->
        <div class="reveal-layout">

            <!-- LEFT: Character standing in their costume -->
            <div class="reveal-character-panel">
                <img id="characterImage" class="character-image" src="" alt="Your character">
            </div>

            <!-- RIGHT: Welcome card + game window + button -->
            <div class="reveal-game-panel">

                <div class="welcome-card">
                    <h1 id="welcomeTitle"></h1>
                    <p class="welcome-sub">Your personalized world is ready!</p>
                    <div class="world-tags">
                        <span class="world-tag" id="themeDisplay"></span>
                        <span class="world-tag" id="vibeDisplay"></span>
                        <span class="world-tag" id="styleDisplay"></span>
                    </div>
                </div>

                <div class="game-soon-window">
                    <div class="game-soon-header">
                        <span class="game-soon-icon">🎮</span>
                        <h2>Your First Game</h2>
                    </div>
                    <div class="game-soon-body">
                        <p class="game-soon-text">Coming Soon!</p>
                        <p class="game-soon-sub">Get ready for an amazing adventure!</p>
                    </div>
                </div>

                <button id="startGameButton" class="start-game-button">Let's Go! →</button>

            </div>
        </div>
    </div>

    <script src="assets/js/world-reveal.js"></script>
</body>
</html>
