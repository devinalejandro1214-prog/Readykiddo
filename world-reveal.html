<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadyKiddo - Your World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/world-reveal.css">
</head>
<body>
    <div class="world-reveal-page">
        <div class="background-container">
            <img id="backgroundImage" class="background-image" src="" alt="Your world background">
        </div>

        <div class="reveal-layout">
            <div class="reveal-character-panel">
                <img id="characterImage" class="character-image" src="" alt="Your character">
            </div>

            <div class="reveal-game-panel">
                <div class="welcome-card">
                    <h1 id="welcomeTitle"></h1>
                    <p class="welcome-sub">Welcome to your personalized world.</p>
                    <div class="world-tags">
                        <span class="world-tag" id="themeDisplay"></span>
                        <span class="world-tag" id="vibeDisplay"></span>
                        <span class="world-tag" id="styleDisplay"></span>
                    </div>
                </div>

                <button id="startGameButton" class="start-game-button">
                    <span class="start-icon" aria-hidden="true">▶</span>
                    <span>Play</span>
                </button>
            </div>
        </div>
    </div>

    <script src="assets/js/world-reveal.js"></script>
</body>
</html>
