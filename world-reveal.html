<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadyKiddo - Your World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/world-reveal.css">
    <link rel="stylesheet" href="assets/css/audio.css">
    <link rel="stylesheet" href="assets/css/feedback.css">
</head>
<body>
    <div class="world-reveal-page">
        <div class="background-container">
            <img id="backgroundImage" class="background-image" src="" alt="Your world background">
        </div>

        <div class="reveal-layout">
            <div class="reveal-character-panel">
                <video id="introVideo" class="intro-video" muted playsinline preload="metadata"></video>
                <img id="characterImage" class="character-image" src="" alt="Your character">
            </div>

            <div class="reveal-game-panel">
                <div class="welcome-card">
                    <h1 id="welcomeTitle"></h1>
                    <p class="welcome-sub">Welcome to your personalized world.</p>
                    <div class="world-tags">
                        <span class="world-tag" id="themeDisplay"></span>
                        <span class="world-tag" id="vibeDisplay"></span>
                        <span class="world-tag" id="styleDisplay"></span>
                    </div>
                </div>

                <button id="startGameButton" class="start-game-button">
                    <span class="start-icon" aria-hidden="true">▶</span>
                    <span>Play</span>
                </button>

                <div id="resumeSection" class="resume-section" hidden>
                    <button id="resumeGameButton" class="resume-game-button" type="button">
                        <span>Resume Game</span>
                    </button>
                    <p id="resumeHint" class="resume-hint"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/audio-manager.js"></script>
    <script src="assets/js/audio-voice.js"></script>
    <script src="assets/js/world-reveal.js"></script>
    <script src="assets/js/feedback-widget.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        // Stop theme song when reaching world reveal
        RKAudio.stopTheme();
        RKAudio.injectMuteButton('body');
        // Try to play welcome immediately. If the browser blocks it (iOS autoplay policy),
        // set a flag so startGameWithWelcome() can speakAndWait before navigating,
        // guaranteeing the full clip plays on the user's gesture instead of getting cut off.
        RKAudio.speak('welcome').then(played => {
          if (!played) window._rkWelcomePending = true;
        });
      });
    </script>
</body>
</html>
