<svg viewBox="0 0 100 100">
      <ellipse cx="50" cy="94" rx="14" ry="2" fill="#000" opacity="0.15"/>
      <!-- handle (wood) -->
      <rect x="38" y="50" width="24" height="42" rx="4" fill="#d4a45e" stroke="#7a5530" stroke-width="3"/>
      <!-- wood grain -->
      <path d="M42 56v32M46 54v36M54 54v36M58 56v32" stroke="#a07636" stroke-width="1" opacity="0.5"/>
      <!-- handle shadow -->
      <path d="M58 50h4v42h-4z" fill="#7a5530" opacity="0.35"/>
      <!-- handle highlight -->
      <rect x="40" y="52" width="3" height="38" rx="1" fill="#f0d0a0" opacity="0.7"/>
      <!-- bottom cap -->
      <rect x="36" y="86" width="28" height="5" rx="1" fill="#5a3818"/>
      <!-- ferrule (metal band) -->
      <rect x="34" y="44" width="32" height="10" rx="1.5" fill="#e0e0e0" stroke="#5a5a5a" stroke-width="2.5"/>
      <rect x="34" y="46" width="32" height="2" fill="#f5f5f5"/>
      <rect x="34" y="51" width="32" height="2" fill="#888"/>
      <!-- ferrule rivets -->
      <circle cx="42" cy="49" r="1.2" fill="#5a5a5a" opacity="1"/>
      <circle cx="50" cy="49" r="1.2" fill="#5a5a5a" opacity="1"/>
      <circle cx="58" cy="49" r="1.2" fill="#5a5a5a" opacity="1"/>
      <!-- bristle base -->
      <path d="M34 44h32l-3-12c-1-6-6-10-13-10s-12 4-13 10z"
            fill="#f4ecd8" stroke="#5a5a5a" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- bristle lines -->
      <path d="M38 42l2-12M44 44l1-16M50 44l0-18M56 44l-1-16M62 42l-2-12M41 44l1.5-14M47 44l0.5-17M53 44l-0.5-17M59 44l-1.5-14" stroke="#aaa" stroke-width="1" opacity="0.7"/>
      <!-- loaded paint on tip -->
      <path d="M40 26c-3-6-1-14 5-17 7-4 16 0 17 8 1 5-2 9-4 12 c-2 2 -2 4 -1 6"
            fill="#2a7fd9" stroke="#1c5fa6" stroke-width="3" stroke-linejoin="round"/>
      <!-- paint gloss -->
      <path d="M44 14c-1-3 2-5 5-5M52 11c2-2 5-2 7 0" stroke="#7fb6f0" stroke-width="2" fill="none" stroke-linecap="round"/>
      <ellipse cx="46" cy="14" rx="3" ry="6" fill="#7fb6f0" opacity="0.65" transform="rotate(-15 46 14)"/>
      <!-- paint drip down handle -->
      <path d="M58 32q2 6 -1 14" stroke="#2a7fd9" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.65"/>
      <!-- splatter -->
      <circle cx="22" cy="22" r="2" fill="#2a7fd9" opacity="0.7"/>
      <circle cx="78" cy="20" r="1.5" fill="#2a7fd9" opacity="0.7"/>
      <circle cx="14" cy="14" r="1" fill="#2a7fd9" opacity="0.7"/>
    </svg>
