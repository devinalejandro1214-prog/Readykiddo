<svg viewBox="0 0 100 100">
      <ellipse cx="50" cy="90" rx="30" ry="3" fill="#000" opacity="0.15"/>
      <!-- conch / nautilus spiral shell -->
      <!-- main body (egg-ish) -->
      <path d="M50 8 C72 10 88 26 88 50 C88 72 72 88 50 88 C30 88 14 74 14 54 C14 36 26 18 50 8 Z"
            fill="#2a7fd9" stroke="#1c5fa6" stroke-width="3" stroke-linejoin="round"/>
      <!-- shading on right side -->
      <path d="M50 8 C72 10 88 26 88 50 C88 72 72 88 50 88 Z" fill="#1c5fa6" opacity="0.18"/>
      <!-- inner spiral chambers (left to right, getting smaller) -->
      <path d="M20 56 C20 38 36 22 56 22 C72 22 84 36 84 52 C84 66 72 78 58 78 C46 78 36 68 36 56 C36 46 44 38 54 38 C62 38 68 44 68 52 C68 58 64 64 58 64 C52 64 48 60 48 54"
            fill="none" stroke="#1c5fa6" stroke-width="2.5" stroke-linecap="round"/>
      <!-- spiral highlight -->
      <path d="M22 54 C22 38 38 24 56 24 C70 24 80 36 80 50"
            fill="none" stroke="#7fb6f0" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
      <!-- chamber dividers (radial ridges) -->
      <path d="M50 24 Q42 36 38 50" stroke="#1c5fa6" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.45"/>
      <path d="M30 38 Q42 44 50 56" stroke="#1c5fa6" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.45"/>
      <path d="M28 58 Q42 60 56 68" stroke="#1c5fa6" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.45"/>
      <!-- aperture (opening) at center -->
      <ellipse cx="56" cy="52" rx="5" ry="4" fill="#1c5fa6" opacity="0.55"/>
      <ellipse cx="55" cy="51" rx="3" ry="2.5" fill="#2a1408" opacity="0.7"/>
      <!-- pearlescent gloss on top-left -->
      <ellipse cx="30" cy="30" rx="12" ry="6" fill="white" opacity="0.5" transform="rotate(-30 30 30)"/>
      <ellipse cx="26" cy="36" rx="3" ry="6" fill="white" opacity="0.7" transform="rotate(-30 26 36)"/>
      <!-- speckled texture -->
      <circle cx="70" cy="38" r="1.2" fill="#7fb6f0" opacity="0.8"/>
      <circle cx="78" cy="56" r="1" fill="#7fb6f0" opacity="0.7"/>
      <circle cx="64" cy="72" r="1" fill="#7fb6f0" opacity="0.6"/>
      <circle cx="40" cy="76" r="1" fill="white" opacity="0.5"/>
      <!-- sparkles -->
      <path d="M76 19L77 21L79 22L77 23L76 25L75 23L73 22L75 21z" fill="white" opacity="0.9"/>
      <path d="M22 67.5L22.833333333333332 69.16666666666667L24.5 70L22.833333333333332 70.83333333333333L22 72.5L21.166666666666668 70.83333333333333L19.5 70L21.166666666666668 69.16666666666667z" fill="white" opacity="0.9"/>
    </svg>
