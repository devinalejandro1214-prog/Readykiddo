<svg viewBox="0 0 100 100">
      <ellipse cx="50" cy="92" rx="28" ry="3" fill="#000" opacity="0.18"/>
      <!-- ball base -->
      <circle cx="50" cy="50" r="38" fill="white" stroke="#c8a000" stroke-width="3"/>
      <!-- 6 segments alternating color/white -->
      <path d="M50 12a38 38 0 0 1 33 19L50 50z" fill="#f4c83b" stroke="#c8a000" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M83 31a38 38 0 0 1 5 19H50z" fill="white" stroke="#c8a000" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M50 50h38a38 38 0 0 1-5 19z" fill="#f4c83b" stroke="#c8a000" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M83 69a38 38 0 0 1-33 19V50z" fill="white" stroke="#c8a000" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M50 88a38 38 0 0 1-33-19L50 50z" fill="#f4c83b" stroke="#c8a000" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M17 69a38 38 0 0 1-5-19h38z" fill="white" stroke="#c8a000" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M50 50H12a38 38 0 0 1 5-19z" fill="#f4c83b" stroke="#c8a000" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M17 31a38 38 0 0 1 33-19V50z" fill="white" stroke="#c8a000" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- shading on right -->
      <path d="M50 12a38 38 0 0 1 0 76 38 38 0 0 0 0-76z" fill="black" opacity="0.08"/>
      <!-- centre cap -->
      <circle cx="50" cy="50" r="6" fill="#ffe590" stroke="#c8a000" stroke-width="2.5"/>
      <circle cx="50" cy="50" r="3" fill="white" opacity="0.6"/>
      <!-- outer ring redraw -->
      <circle cx="50" cy="50" r="38" fill="none" stroke="#c8a000" stroke-width="3"/>
      <!-- big gloss -->
      <ellipse cx="32" cy="28" rx="12" ry="6" fill="white" opacity="0.7" transform="rotate(-30 32 28)"/>
      <ellipse cx="28" cy="36" rx="3" ry="6" fill="white" opacity="0.5" transform="rotate(-30 28 36)"/>
      <!-- bottom shadow on ball -->
      <ellipse cx="50" cy="76" rx="20" ry="6" fill="#c8a000" opacity="0.12"/>
    </svg>
