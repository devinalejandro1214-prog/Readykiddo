<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Build Your World - Onboarding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/onboarding.css">
</head>
<body>
    <div class="onboarding-page">
        <div class="background-container">
            <picture>
                <source srcset="assets/images/backgrounds/onboarding-bg.webp" type="image/webp">
                <img src="assets/images/backgrounds/onboarding-bg.png" alt="Onboarding Background" class="background-image">
            </picture>
        </div>

        <div class="onboarding-container">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div class="question-card" id="questionCard">
                <!-- Dynamic content will be inserted here -->
            </div>
        </div>
    </div>

    <script src="assets/js/onboarding.js"></script>
</body>
</html>
