<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ReadyKiddo — Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      font-family: 'Fredoka', system-ui, sans-serif;
      background: #0a1428;
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .game-container {
      position: relative;
      width: 100%;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .game-background {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
    }

    .background-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .game-background::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0.25) 100%);
      z-index: 2;
    }

    .game-area {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .game-character {
      position: absolute;
      left: 2%;
      bottom: 5%;
      width: 35%;
      max-width: 520px;
      height: 70%;
      max-height: 700px;
      z-index: 5;
      pointer-events: none;
      animation: charRise 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    .game-character img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: bottom center;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 1))
        drop-shadow(0 0 24px rgba(242, 140, 24, 0.5))
        drop-shadow(0 0 8px rgba(11, 95, 149, 0.4))
        drop-shadow(0 16px 36px rgba(0, 0, 0, 0.42));
    }

    @keyframes charRise {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes cheer {
      0%, 100% {
        transform: translateY(0) rotate(0);
      }
      25% {
        transform: translateY(-18px) rotate(-2deg);
      }
      50% {
        transform: translateY(-8px) rotate(0);
      }
      75% {
        transform: translateY(-18px) rotate(2deg);
      }
    }

    @keyframes nod {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes sway {
      0%, 100% {
        transform: rotate(0);
      }
      25% {
        transform: rotate(-2deg);
      }
      75% {
        transform: rotate(2deg);
      }
    }

    @keyframes thumbsUp {
      0% {
        transform: scale(1) translateY(0);
      }
      50% {
        transform: scale(1.1) translateY(-10px);
      }
      100% {
        transform: scale(1) translateY(0);
      }
    }

    @keyframes wave {
      0%, 100% {
        transform: rotate(0);
      }
      25% {
        transform: rotate(-10deg);
      }
      75% {
        transform: rotate(10deg);
      }
    }

    @keyframes dance {
      0%, 100% {
        transform: translateY(0) rotate(0);
      }
      25% {
        transform: translateY(-10px) rotate(-5deg);
      }
      50% {
        transform: translateY(0) rotate(0);
      }
      75% {
        transform: translateY(-10px) rotate(5deg);
      }
    }

    .loading-spinner {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 20, 40, 0.9);
      z-index: 100;
      animation: fadeOut 0.5s ease-out 2s forwards;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        pointer-events: none;
      }
    }

    .loading-text {
      color: white;
      margin-top: 20px;
      font-size: 14px;
      opacity: 0.8;
    }
  </style>
  <link rel="stylesheet" href="assets/css/feedback.css">
  <link rel="stylesheet" href="assets/css/audio.css">
  <link rel="stylesheet" href="assets/css/session-manager.css">
</head>
<body>
  <div class="loading-spinner" id="loadingSpinner">
    <div>
      <div class="spinner"></div>
      <div class="loading-text">Loading your adventure...</div>
    </div>
  </div>

  <!-- Scripts in order -->
  <script src="assets/js/audio-manager.js"></script>
  <script src="assets/js/audio-voice.js"></script>
  <script src="assets/js/games/item-data.js"></script>
  <script src="assets/js/games/shape-definitions.js"></script>
  <script src="assets/js/games/session-manager.js"></script>
  <script src="assets/js/games/game-shell.js"></script>
  <script src="assets/js/games/game-registry.js"></script>

  <script>
    /* ─────────────────────────────────────────────────────────
       Game Initialization
       ───────────────────────────────────────────────────────── */

    async function initializeGame() {
      try {
        // Get game type from URL parameter or default to color-sort
        const params = new URLSearchParams(window.location.search);
        const gameType = params.get('game') || 'color-sort';

        console.log(`[Game Loader] Initializing game: ${gameType}`);

        // Check if user profile exists (from onboarding)
        let profile = localStorage.getItem('userProfile');
        if (!profile) {
          console.warn('No user profile found, setting default test profile...');
          profile = JSON.stringify({
            childName: "TestPilot",
            theme: "space",
            character: "mica",
            style: "plain",
            vibe: "cozy"
          });
          localStorage.setItem('userProfile', profile);
        }

        // Load and start the game
        const game = await loadGame(gameType);

        if (!game) {
          console.error('Failed to initialize game');
          // Fallback to world-reveal
          setTimeout(() => {
            window.location.href = 'world-reveal.html';
          }, 2000);
        }
      } catch (error) {
        console.error('Game initialization error:', error);
        window.location.href = 'world-reveal.html';
      }
    }

    // Start when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        if (window.RKAudio) RKAudio.injectMuteButton('body');
        initializeGame();
      });
    } else {
      if (window.RKAudio) RKAudio.injectMuteButton('body');
      initializeGame();
    }
</script>
    <script src="assets/js/feedback-widget.js"></script>
</body>
</html>
